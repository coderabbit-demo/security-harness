name: CI

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Post context
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Building PR: $TITLE"
          echo "PR titled ${{ github.event.pull_request.title }} built successfully"
