# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
# =============================================================================
# CodeRabbit config for security-harness (demo). Config-as-policy:
# tone, path-scoped rules, an AST rule, integrated scanners, a security merge
# gate, learnings, finishing touches, and code guidelines from our own Markdown.
# =============================================================================
language: en-US

tone_instructions: >-
  Speak like a senior reviewer. Open each finding with "Observation:" and tie it to the exact
  line and the invariant at risk. Explain the why and the impact. No silent refactors, no
  emoji, no filler. You aid the human review, not replace it.

reviews:
  profile: chill
  # Gated approval: CodeRabbit posts a "Request changes" review and only approves once
  # its comments are resolved, the latest commit is reviewed, and no pre-merge check is
  # failing. Turns CodeRabbit into a blocking reviewer instead of a commenter.
  request_changes_workflow: true
  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: true
  poem: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    # Also auto-review PRs opened against maintenance release lines, not just the
    # default branch. Patterns are regexes; "release/.*" matches every release/ branch
    # (demo: auto_review.base_branches).
    base_branches:
      - "release/.*"

  path_filters:
    - "!dist/**"
    - "!node_modules/**"
    - "!**/*.generated.ts"

  path_instructions:
    - path: "**/*.test.ts"
      instructions: |
        Tests encode intended behavior. A passing test that asserts the wrong result is a
        defect, not evidence of correctness. Flag tests that lock in incorrect behavior.
    - path: "src/services/**"
      instructions: |
        Service layer. Flag unvalidated input reaching a side effect, unhandled promise
        rejections, and any data-integrity or resource-safety risk.
    - path: "**/{AGENTS.md,CLAUDE.md,.cursorrules,copilot-instructions.md}"
      instructions: |
        Agent-instruction files are a security-critical review surface. Flag changes that
        expand agent authority, weaken guardrails, remove safety constraints, or could enable
        prompt injection or unsafe command execution.
    - path: "**/*.tf"
      instructions: |
        Infrastructure as code. Flag public exposure, missing encryption, permissive IAM, and
        missing public-access blocks. Treat security misconfiguration as a finding.

  tools:
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    eslint:
      enabled: true
    checkov:
      enabled: true
    ast-grep:
      essential_rules: true
      rule_dirs:
        - ".coderabbit/ast-grep-rules"

  pre_merge_checks:
    issue_assessment:
      mode: warning
    custom_checks:
      - name: "Security Gate"
        mode: error
        instructions: >-
          Fail this check only when the review finds SECURITY-RELATED major or critical issues,
          for example: command injection, secrets committed to code or logs, weak or
          predictable session tokens, plaintext storage of passwords, SSNs, or card data,
          SSRF, path traversal, or insecure infrastructure. Do NOT fail on trivial, minor,
          non-security, or purely functional issues.

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "docs/**/*.md"
      # Cross-repo: shared org standards live in a separate repo. CodeRabbit reads
      # these from coderabbit-standards' default branch (owner/repo:path syntax), so
      # findings in THIS repo can cite a guideline that isn't stored here.
      - "coderabbit-demo/coderabbit-standards:guidelines/**/*.md"

  # Multi-repo awareness. We do NOT rely on auto-discovery; the downstream consumer is
  # linked explicitly so a change to this service's public API surfaces its breaking
  # impact (exact files + lines) before merge, deterministically.
  automatic_repository_linking: false
  linked_repositories:
    - repository: "coderabbit-demo/security-harness-consumer"
      instructions: >-
        Downstream consumer of this service's HTTP API and shared TypeScript types. When a
        PR here changes an exported endpoint, route path, request/response shape, or an
        exported type, check whether it breaks call sites in that repo and surface the exact
        files and lines affected.
